
name: Build iOS Mod Menu

on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'VERSION.txt'
      - 'template/**'
      - 'Makefile'
      - 'Tweak.xm'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check GitHub runner
        run: |
          echo "Linux runner started"
          date -u

  build:
    needs: runner-test
    runs-on: macos-15
    timeout-minutes: 45

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION.txt)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew list ldid >/dev/null 2>&1 || brew install ldid
          brew list dpkg >/dev/null 2>&1 || brew install dpkg
          xcodebuild -version

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: theos
          theos-sdks: https://github.com/theos/sdks

      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Tweak.xm ]; then
            cp template/Tweak.xm Tweak.xm
          fi

          if [ -f template/Offsets.h ]; then
            cp template/Offsets.h Offsets.h
          fi

          cp template/control control
          sed -i.bak "s/__VERSION__/${VERSION}/g" control
          rm -f control.bak

          if [ ! -f Makefile ]; then
            cat > Makefile <<'EOF'
          TARGET := iphone:clang:latest:15.0
          ARCHS = arm64
          THEOS_PACKAGE_SCHEME = rootless

          INSTALL_TARGET_PROCESSES = DreamRoadMultiplayer

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = FEW1NMod
          FEW1NMod_FILES = Tweak.xm
          FEW1NMod_CFLAGS = -fobjc-arc -std=c++14
          FEW1NMod_FRAMEWORKS = UIKit Foundation QuartzCore CoreGraphics ImageIO PhotosUI
          FEW1NMod_LIBRARIES = substrate

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF
          fi

          if [ ! -f FEW1NMod.plist ]; then
            echo '{ Filter = { Bundles = ( "com.TenebryFox.DreamRoadMultiplayer" ); }; }' > FEW1NMod.plist
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output extracted

          find packages -name '*.deb' -exec cp {} output/ \;

          DEB=$(find output -name '*.deb' -print -quit)
          test -n "$DEB"

          dpkg-deb -x "$DEB" extracted

          DYLIB=$(find extracted -name '*.dylib' -print -quit)
          test -n "$DYLIB"

          cp "$DYLIB" output/FEW1NMod.dylib
          ls -lh output

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: FEW1NMod-${{ env.VERSION }}-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
